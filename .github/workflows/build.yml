name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin zip
          rustup update stable
          rustup default stable

      - name: Build and test
        run: ./scripts/build.sh

      - name: Check the tag matches metadata.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c "import json;print(json.load(open('extension/snowhush-gnome@wojtipek/metadata.json'))['version-name'])")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, but metadata.json says $version"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: snowhush-gnome
          path: dist/snowhush-gnome-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/snowhush-gnome-*.zip dist/snowhush-gnome.zip
          gh release create "$GITHUB_REF_NAME" dist/snowhush-gnome-*.zip dist/snowhush-gnome.zip --title "$GITHUB_REF_NAME" --generate-notes
